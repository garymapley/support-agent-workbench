name: support-agent

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  qdrant:
    image: qdrant/qdrant:v1.20.0@sha256:9bfc89f9914fc14876a88c05270685921a55b8877b254a98bcc1cc2f0a424cd2
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    logging: *default-logging
    volumes:
      - qdrant_data:/qdrant/storage
    expose:
      - "6333"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c ':> /dev/tcp/127.0.0.1/6333'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    tmpfs:
      - /tmp:size=64m,mode=1777
    logging: *default-logging
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////app/data/app.db
      CHECKPOINT_DATABASE_PATH: /app/data/checkpoints.db
      QDRANT_URL: http://qdrant:6333
      QDRANT_PATH: ""
      LOG_PATH: /app/logs/agent.jsonl
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - api_data:/app/data
      - api_logs:/app/logs
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: web
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    tmpfs:
      - /tmp:size=64m,mode=1777
    logging: *default-logging
    environment:
      BACKEND_API_URL: http://api:8000
      ADMIN_TOKEN: ${ADMIN_TOKEN:?请先在根目录 .env 中配置 ADMIN_TOKEN}
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:?请先在根目录 .env 中配置 OPERATOR_TOKEN}
      WORKBENCH_ADMIN_USERNAME: ${WORKBENCH_ADMIN_USERNAME:-admin}
      WORKBENCH_ADMIN_PASSWORD: ${WORKBENCH_ADMIN_PASSWORD:?请配置审批管理员登录密码}
      WORKBENCH_OPERATOR_USERNAME: ${WORKBENCH_OPERATOR_USERNAME:-operator}
      WORKBENCH_OPERATOR_PASSWORD: ${WORKBENCH_OPERATOR_PASSWORD:?请配置操作员登录密码}
      WORKBENCH_SESSION_SECRET: ${WORKBENCH_SESSION_SECRET:?请配置工作台会话密钥}
      WORKBENCH_COOKIE_SECURE: ${WORKBENCH_COOKIE_SECURE:-false}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/api/health')
          .then(r=>{if(!r.ok)process.exit(1)})
          .catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  knowledge-init:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["tools"]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    tmpfs:
      - /tmp:size=64m,mode=1777
    logging: *default-logging
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_PATH: ""
    command: ["python", "-m", "scripts.ingest_knowledge"]
    depends_on:
      qdrant:
        condition: service_healthy

volumes:
  api_data:
  api_logs:
  qdrant_data:
